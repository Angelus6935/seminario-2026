<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Semana de Recuperación · Seminario</title>
<style>
:root{--bg:#070b18;--card:#111a33;--card2:#18244a;--cyan:#2DD4E8;--amber:#F5B642;--pink:#ff4fa3;--violet:#8b5cf6;--text:#e8eefc;--muted:#93a0c0;--ok:#34d399;--bad:#f87171;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(circle at 20% 0%,#1a1550 0%,var(--bg) 55%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.1;margin:8px 0 6px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;margin:6px 0 10px;color:var(--cyan)}
h3{margin:8px 0}
p{line-height:1.5}
.muted{color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;margin:12px 0 0;font-size:17px;font-weight:700;color:#06101f;background:linear-gradient(90deg,var(--cyan),#7ee8f5);cursor:pointer;box-shadow:0 6px 22px rgba(45,212,232,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn.amber{background:linear-gradient(90deg,var(--amber),#ffd27a)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid #33406a;box-shadow:none}
.lang{display:flex;gap:6px;justify-content:flex-end}
.lang button{border:1px solid #33406a;background:transparent;color:var(--muted);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--cyan);color:#06101f;border-color:var(--cyan)}
input[type=text],textarea{width:100%;border-radius:12px;border:1px solid #33406a;background:#0c1328;color:var(--text);padding:14px;font-size:17px;font-family:inherit}
textarea{min-height:150px;resize:vertical}
.card{background:linear-gradient(160deg,var(--card),#0d1430);border:1px solid #223061;border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(245,182,66,.4);border-radius:999px;padding:4px 10px}
.quote{border-left:3px solid var(--amber);padding:8px 12px;margin:10px 0;background:rgba(245,182,66,.07);border-radius:0 10px 10px 0;font-style:italic}
.quote small{display:block;font-style:normal;color:var(--amber);margin-top:6px}
.inst{background:rgba(45,212,232,.08);border:1px dashed rgba(45,212,232,.45);border-radius:12px;padding:10px 12px;margin-top:12px}
ul.tight{padding-left:20px;margin:6px 0} ul.tight li{margin:4px 0}
.day-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #223061;background:linear-gradient(160deg,var(--card),#0d1430);color:var(--text);border-radius:18px;padding:14px;margin:10px 0;cursor:pointer}
.day-card.done{border-color:var(--ok)}
.dc-emo{font-size:36px}
.dc-txt{flex:1;display:flex;flex-direction:column}
.dc-txt b{font-size:18px}.dc-txt small{color:var(--cyan);font-size:14px}.dc-txt em{color:var(--muted);font-size:12px;font-style:normal}
.dc-st{font-size:22px;color:var(--amber)}
.day-card.done .dc-st{color:var(--ok)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ghead .badge{max-width:75%}
.iconbtn{border:1px solid #33406a;background:#0c1328;color:var(--text);border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer}
canvas.gc{width:100%;height:auto;display:block;border-radius:16px;border:1px solid #223061;touch-action:none;background:#0a0f22}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:8px 0}
.pad{display:flex;gap:12px;margin-top:10px}
.pad button{flex:1;font-size:28px;padding:14px 0;border-radius:14px;border:1px solid #33406a;background:#111a33;color:var(--cyan);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:#1d2b57}
.opt{display:block;width:100%;text-align:left;border:1px solid #33406a;background:#0f1730;color:var(--text);border-radius:14px;padding:14px;margin:10px 0;font-size:16px;cursor:pointer;line-height:1.35}
.opt.ok{border-color:var(--ok);background:rgba(52,211,153,.15)}
.opt.bad{border-color:var(--bad);background:rgba(248,113,113,.12);opacity:.7}
.fb{min-height:24px;font-weight:700;text-align:center;margin-top:6px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{border:1px solid #33406a;background:#0f1730;color:var(--text);border-radius:12px;padding:10px 8px;font-size:13.5px;line-height:1.3;min-height:58px;cursor:pointer}
.mitem.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(245,182,66,.4)}
.mitem.ok{border-color:var(--ok);background:rgba(52,211,153,.15);color:#c9f7e6}
.mitem.bad{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.beacons{display:flex;justify-content:center;gap:8px;margin:6px 0 14px}
.beacons span{width:26px;height:26px;border-radius:50%;background:#1a2346;border:1px solid #33406a;transition:.3s}
.beacons span.on{background:radial-gradient(circle,#fff6c9,var(--amber));box-shadow:0 0 14px var(--amber);border-color:var(--amber)}
.scard{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:18px;border-radius:18px;background:linear-gradient(160deg,#1a2550,#0f1633);border:1px solid #2d3d78;touch-action:pan-y;user-select:none}
.scard.in{animation:fade .3s}
.semo{font-size:46px;margin-bottom:8px}
.row2{display:flex;gap:10px;margin-top:12px}
.row2 button{flex:1;margin:0}
.btn.red{background:linear-gradient(90deg,#f87171,#fca5a5)}
.btn.green{background:linear-gradient(90deg,#34d399,#86efac)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.slot{min-height:84px;border:2px dashed #33406a;border-radius:14px;padding:8px;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;background:#0c1328}
.slot b{display:block;color:var(--amber);font-size:13px;margin-bottom:4px}
.slot.full{border-style:solid;border-color:var(--ok);color:var(--text);background:rgba(52,211,153,.08)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #33406a;background:#111a33;color:var(--text);border-radius:999px;padding:9px 12px;font-size:14px;cursor:pointer}
.chip.sel{border-color:var(--amber);background:rgba(245,182,66,.15)}
.chip.on{border-color:var(--cyan);background:rgba(45,212,232,.15)}
.chip.bad{animation:shake .4s;border-color:var(--bad)}
.picker{display:flex;gap:10px;justify-content:center;margin:8px 0}
.picker button{width:56px;height:56px;border-radius:14px;border:2px solid #33406a;cursor:pointer}
.story .simg{width:100%;border-radius:16px;display:block;border:1px solid #223061;margin-bottom:8px}
.stext{white-space:pre-line;line-height:1.55;font-size:16.5px;min-height:60px}
.stext.q{font-style:italic;border-left:3px solid var(--amber);padding-left:12px}
.scrolls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.scroll{border:1px solid #6b5a2d;background:linear-gradient(160deg,#2a2210,#171207);color:#f8e3b0;border-radius:12px;padding:10px;font-size:13.5px;min-height:70px;cursor:pointer;text-align:left}
.scroll b{color:var(--amber);display:block;margin-bottom:4px}
.scroll.open{border-color:var(--amber);box-shadow:0 0 10px rgba(245,182,66,.3)}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#223061;border-radius:14px;padding:3px;aspect-ratio:1/1}
.pz div{background-size:300% 300%;border-radius:6px;cursor:pointer;transition:transform .15s}
.pz div.sel{outline:3px solid var(--amber);transform:scale(.94)}
.pz div.okp{outline:1px solid rgba(52,211,153,.6)}
.ws{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;user-select:none}
.ws div{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#0f1730;border:1px solid #26335f;border-radius:7px;font-weight:800;font-size:17px;cursor:pointer}
.ws div.start{background:var(--amber);color:#06101f}
.ws div.found{background:rgba(52,211,153,.25);border-color:var(--ok);color:#d1fae5}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.wlist span{padding:5px 10px;border-radius:999px;border:1px solid #33406a;font-size:13px;font-weight:700;letter-spacing:.05em}
.wlist span.f{text-decoration:line-through;color:var(--ok);border-color:var(--ok)}
.sdk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:340px;margin:0 auto;background:var(--amber);padding:4px;border-radius:14px}
.sdk div{aspect-ratio:1/1;background:#0f1730;display:flex;align-items:center;justify-content:center;font-size:34px;border-radius:6px;cursor:pointer}
.sdk div.g{background:#1a2550;cursor:default}
.sdk div.sel{outline:3px solid var(--cyan)}
.sdk div.bad{animation:shake .4s;background:rgba(248,113,113,.3)}
.sdk div.bR{margin-right:4px}.sdk div.bB{margin-bottom:4px}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pal button{border:1px solid #33406a;background:#111a33;color:var(--text);border-radius:12px;padding:8px 4px;font-size:26px;cursor:pointer}
.pal button small{display:block;font-size:11px;color:var(--muted)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{aspect-ratio:3/4;border-radius:12px;perspective:600px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;font-size:12.5px;line-height:1.25}
.mc .f{background:linear-gradient(160deg,#2a1d5c,#141a3d);border:1px solid #3c3f86;font-size:28px}
.mc .b{transform:rotateY(180deg);background:#0f1730;border:1px solid var(--cyan)}
.mc .b.ref{color:var(--amber);font-weight:800;font-size:14px}
.mc.done .b{border-color:var(--ok);background:rgba(52,211,153,.12)}
#end-img{width:100%;border-radius:16px;margin-top:14px;display:none;border:1px solid #223061}
.counter{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.center{text-align:center}
.big-emo{font-size:64px;text-align:center;margin:8px 0}
</style>
</head>
<body>
<div id="app">

<section class="screen active" id="s-start">
  <div class="lang"><button data-lang="es" class="on">ES</button><button data-lang="en">EN</button></div>
  <div class="big-emo">🎮</div>
  <h1 data-i18n="appTitle"></h1>
  <p class="muted" data-i18n="appSub"></p>
  <div class="card">
    <label for="in-name" data-i18n="askName"></label>
    <input type="text" id="in-name" maxlength="24" autocomplete="off">
    <button class="btn" id="btn-start" disabled data-i18n="start"></button>
  </div>
</section>

<section class="screen" id="s-hub">
  <div class="lang"><button data-lang="es" class="on">ES</button><button data-lang="en">EN</button></div>
  <h1 id="hub-hello"></h1>
  <p class="muted" data-i18n="hubSub"></p>
  <div id="hub-days"></div>
</section>

<section class="screen" id="s-intro">
  <span class="badge" id="in-badge"></span>
  <h2 id="in-title"></h2>
  <div class="card" id="in-body"></div>
  <button class="btn" id="in-btn"></button>
</section>

<section class="screen" id="s-game">
  <div class="ghead"><span class="badge" id="g-label"></span><button class="iconbtn" id="g-voice">🔇</button></div>
  <div id="g-area"></div>
</section>

<section class="screen" id="s-mc">
  <span class="badge" id="mc-label"></span>
  <h2 id="mc-q"></h2>
  <div id="mc-opts"></div>
  <div class="fb" id="mc-fb"></div>
  <button class="btn" id="mc-next" style="display:none" data-i18n="continue"></button>
</section>

<section class="screen" id="s-written">
  <span class="badge" id="wr-label"></span>
  <h2 id="wr-q"></h2>
  <p class="muted" data-i18n="writeHint"></p>
  <textarea id="wr-text" maxlength="400"></textarea>
  <div class="counter" id="wr-count"></div>
  <button class="btn amber" id="wr-btn" disabled data-i18n="send"></button>
</section>

<section class="screen" id="s-end">
  <div class="big-emo">🏁</div>
  <h1 id="end-title"></h1>
  <p class="muted" data-i18n="endSub"></p>
  <button class="btn amber" id="end-share" data-i18n="share"></button>
  <p class="hint" id="end-msg"></p>
  <img id="end-img" alt="">
  <button class="btn ghost" id="end-back" data-i18n="backHub"></button>
</section>

</div>

// ===================== AUDIO (Web Audio sintético) =====================
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, delay) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  const t = a.currentTime + (delay || 0);
  g.gain.setValueAtTime(v || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
}
const sfx = {
  ok() { tone(660, .12, 'triangle', .14); tone(990, .2, 'triangle', .14, .1); },
  bad() { tone(170, .28, 'sawtooth', .1); },
  click() { tone(540, .05, 'square', .05); },
  beep() { tone(440, .15, 'square', .08); },
  go() { tone(880, .3, 'square', .1); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .14, i * .12)); }
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }

// ===================== VOZ (narración opcional) =====================
function speak(txt) {
  if (!S.voice || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(txt).replace(/<[^>]+>/g, ' '));
    u.lang = S.lang === 'es' ? 'es-ES' : 'en-US'; u.rate = 1;
    speechSynthesis.speak(u);
  } catch (e) { }
}
function stopSpeak() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { } }

// ===================== LOOP (nunca se detiene) =====================
let active = null, lastT = 0;
const KEY = {};
window.addEventListener('keydown', e => { KEY[e.key] = true; if (active && active.onKey) active.onKey(e.key); });
window.addEventListener('keyup', e => { KEY[e.key] = false; });
function loop(t) {
  const dt = Math.min(0.05, ((t - lastT) / 1000) || 0); lastT = t;
  if (active) {
    try { if (active.update) active.update(dt); if (active.draw) active.draw(); }
    catch (err) { console.error(err); active = null; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ===================== HELPERS DE CANVAS =====================
function makeCanvas(area, w, h) {
  const cv = el('canvas', 'gc'); cv.width = w; cv.height = h; cv.style.aspectRatio = w + '/' + h;
  area.appendChild(cv);
  return { cv, ctx: cv.getContext('2d') };
}
function cvPos(cv, e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function pad(area, opts) {
  opts = opts || {};
  const st = { l: false, r: false };
  const p = el('div', 'pad'); const bl = el('button', '', '◀'), br = el('button', '', '▶');
  [[bl, 'l', opts.onL], [br, 'r', opts.onR]].forEach(([b, k, cb]) => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); st[k] = true; if (cb) cb(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { st[k] = false; }));
  });
  p.append(bl, br); area.appendChild(p);
  return st;
}

function startDay(id) {
  const day = DAYS[id];

  nextLevel();
}
function levelLabel() {
  const c = S.cur; return T(c.day.name) + ' · ' + T(c.day.unit) + ' ' + (Math.min(c.li, 3) + 1) + '/4';
}

function wrapLines(ctx, text, maxW) {
  const words = String(text).split(' '); const lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}

  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  g.fillStyle = 'rgba(255,255,255,.06)'; rr(g, 80, 705, W - 160, 520, 28); g.fill();
  g.fillStyle = '#2DD4E8'; g.font = 'bold 32px system-ui,Arial'; g.fillText(T(UI.reflection), 115, 760);
  g.fillStyle = '#93a0c0'; g.font = 'italic 28px system-ui,Arial';
  const ql = wrapLines(g, res.q, W - 230); ql.slice(0, 3).forEach((l, i) => g.fillText(l, 115, 805 + i * 36));
  let y0 = 805 + Math.min(3, ql.length) * 36 + 24, fs = 38, lines;
  const avail = 1200 - y0;
  for (; fs >= 22; fs -= 2) { g.font = fs + 'px system-ui,Arial'; lines = wrapLines(g, '“' + res.answer + '”', W - 230); if (lines.length * fs * 1.3 <= avail) break; }
  g.fillStyle = '#ffffff';
  const maxL = Math.floor(avail / (fs * 1.3));

  g.textAlign = 'center'; g.fillStyle = '#93a0c0'; g.font = '26px system-ui,Arial';

  const W = 360, H = 480, GOAL = 10;

    { e: '🙏', l: { es: 'Oración', en: 'Prayer' } }, { e: '📖', l: { es: 'Escrituras', en: 'Scriptures' } },
    { e: '👨‍👩‍👧', l: { es: 'Servir en familia', en: 'Serve family' } }, { e: '🎶', l: { es: 'Himnos', en: 'Hymns' } },
    { e: '💌', l: { es: 'Visitar a alguien', en: 'Visit someone' } }, { e: '🤝', l: { es: 'Ministrar', en: 'Minister' } },
    { e: '🍞', l: { es: 'Santa Cena', en: 'Sacrament' } }];

    { e: '📱', l: { es: 'Scroll infinito', en: 'Endless scroll' } }, { e: '🛒', l: { es: 'Compras', en: 'Shopping' } },
    { e: '🎮', l: { es: 'Gaming todo el día', en: 'All-day gaming' } }, { e: '📺', l: { es: 'Maratón de series', en: 'Binge-watching' } }];
  let bx = W / 2, items = [], spawn = .4, count = 0, errors = 0, t = 0, floats = [], fin = false;
  const move = e => { bx = clamp(cvPos(cv, e).x, 45, W - 45); };
  cv.addEventListener('pointerdown', e => { move(e); });
  cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') move(e); });
  active = {
    update(dt) {
      if (fin) return; t += dt;
      if (ctr.l || KEY.ArrowLeft) bx -= 260 * dt;
      if (ctr.r || KEY.ArrowRight) bx += 260 * dt;
      bx = clamp(bx, 45, W - 45);
      spawn -= dt;
      if (spawn <= 0) {
        spawn = Math.max(.55, 1.0 - t * .01);
        const g = Math.random() < .6, src = g ? good : bad, it = src[rnd(src.length)];
        items.push({ x: 40 + Math.random() * (W - 80), y: -20, v: 105 + Math.random() * 50 + t * 2, good: g, e: it.e, l: T(it.l) });
      }
      for (const it of items) {
        it.y += it.v * dt;
        if (!it.hit && it.y > 415 && it.y < 455 && Math.abs(it.x - bx) < 52) {
          it.hit = true;

          else { count = Math.max(0, count - 1); errors++; sfx.bad(); buzz(120); floats.push({ x: it.x, y: 410, t: T({ es: '¡Distracción!', en: 'Distraction!' }), c: '#f87171', a: 1 }); }
        }

    },
    draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b1240'); g.addColorStop(1, '#2a1650');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      for (const it of items) {
        ctx.font = '30px serif'; ctx.fillText(it.e, it.x, it.y);
        ctx.font = 'bold 11px system-ui'; ctx.fillStyle = it.good ? '#bff6ff' : '#ffc2c2'; ctx.fillText(it.l, it.x, it.y + 16); ctx.fillStyle = '#fff';
      }
      // canasta
      ctx.fillStyle = '#F5B642'; rr(ctx, bx - 45, 430, 90, 26, 10); ctx.fill();
      ctx.fillStyle = '#7a4f12'; ctx.fillRect(bx - 40, 438, 80, 4); ctx.fillRect(bx - 40, 446, 80, 3);
      for (const f of floats) { ctx.globalAlpha = Math.max(0, f.a); ctx.fillStyle = f.c; ctx.font = 'bold 18px system-ui'; ctx.fillText(f.t, f.x, f.y); }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.fillText(T({ es: 'Día santo: ', en: 'Holy day: ' }) + count + '/' + GOAL, W / 2, 30);

function genWS(words, N) {
  const dirs = [[0, 1], [1, 0], [1, 1]];
  for (let at = 0; at < 300; at++) {
    const g = Array.from({ length: N }, () => Array(N).fill('')); const pos = {}; let ok = true;
    for (const w of shuffle(words)) {
      let placed = false;
      for (let tr = 0; tr < 200 && !placed; tr++) {
        const [dr, dc] = dirs[rnd(3)];
        const r0 = rnd(N - dr * (w.length - 1)), c0 = rnd(N - dc * (w.length - 1));
        let fits = true;
        for (let k = 0; k < w.length; k++) { const ch = g[r0 + dr * k][c0 + dc * k]; if (ch && ch !== w[k]) { fits = false; break; } }
        if (!fits) continue;
        pos[w] = [];
        for (let k = 0; k < w.length; k++) { g[r0 + dr * k][c0 + dc * k] = w[k]; pos[w].push((r0 + dr * k) * N + c0 + dc * k); }
        placed = true;
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) { const A = 'ABCDEFGHIJKLMNOPRSTUVYZ'; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!g[r][c]) g[r][c] = A[rnd(A.length)]; return { g, pos }; }
  }
  return null;
}

    const dr = Math.sign(r - r1), dc = Math.sign(c - c1);

    start = null;

    const idx = []; let str = '';
    for (let k = 0; k < len; k++) { const ii = (r1 + dr * k) * N + (c1 + dc * k); idx.push(ii); str += g[r1 + dr * k][c1 + dc * k]; }
    const rev = str.split('').reverse().join('');

    } else { sfx.bad(); }

    { e: '🤝', l: { es: 'Acompañar', en: 'Support' } }, { e: '🧠', l: { es: 'Estrategia', en: 'Strategy' } }];
  const base = [0, 1, 2, 3, 2, 3, 0, 1, 1, 0, 3, 2, 3, 2, 1, 0];
  const perm = shuffle([0, 1, 2, 3]);
  const sol = base.map(v => perm[v]);
  let puzzle;
  do { const blanks = shuffle([...Array(16).keys()]).slice(0, 7); puzzle = sol.map((v, i) => blanks.includes(i) ? -1 : v); } while (countSolutions(puzzle) !== 1);
  window.__sdk = sol;
  area.appendChild(el('p', 'hint', T({ es: 'Completá la grilla: cada fila, columna y cuadro de 2×2 debe tener las 4 cualidades de un buen mentor una sola vez. Tocá una casilla vacía y elegí la cualidad.', en: 'Fill the grid: each row, column and 2×2 box must have the 4 qualities of a good mentor exactly once. Tap an empty cell and choose a quality.' })));
  const grid = el('div', 'sdk'); area.appendChild(grid);
  const pal = el('div', 'pal'); area.appendChild(pal);
  const fb = el('p', 'hint', ''); area.appendChild(fb);
  let sel = null, left = puzzle.filter(v => v < 0).length, errors = 0, fin = false;
  const cells = puzzle.map((v, i) => {
    const d = el('div', v >= 0 ? 'g' : '', v >= 0 ? SYMS[v].e : ''); d.dataset.i = i;
    d.onclick = () => { if (fin || puzzle[i] >= 0) return; cells.forEach(x => x.classList.remove('sel')); d.classList.add('sel'); sel = i; sfx.click(); };
    grid.appendChild(d); return d;
  });
  SYMS.forEach((s, v) => {
    const b = el('button', '', s.e + '<small>' + T(s.l) + '</small>'); b.dataset.v = v;
    b.onclick = () => {
      if (fin) return;
      if (sel === null) { fb.textContent = T({ es: 'Primero tocá una casilla vacía.', en: 'First tap an empty cell.' }); return; }
      const c = cells[sel];
      if (sol[sel] === v) {
        sfx.ok(); puzzle[sel] = v; c.textContent = s.e; c.classList.remove('sel'); c.classList.add('g'); sel = null; left--; fb.textContent = '';
        if (left === 0) { fin = true; sfx.win(); fb.textContent = T({ es: '¡Grilla completa!', en: 'Grid complete!' }); setTimeout(() => done(100 + Math.max(0, 60 - errors * 15)), 900); }
      } else {
        errors++; sfx.bad(); buzz(80); c.classList.add('bad'); setTimeout(() => c.classList.remove('bad'), 450);
        fb.textContent = T({ es: 'Esa no va ahí. Revisá qué falta en la fila, la columna y el cuadro.', en: "That one doesn't go there. Check what's missing in the row, column and box." });
      }
    };
    pal.appendChild(b);
  });
}

// ---------- VIERNES 4: Memoria ----------
function gameMemory(area, done, pairs) {
  area.appendChild(el('p', 'hint', T({ es: 'Encontrá cada escritura con su enseñanza. Tocá dos cartas.', en: 'Match each scripture with its teaching. Tap two cards.' })));
  const deck = shuffle(pairs.flatMap((p, i) => [{ id: i, t: T(p[0]), ref: true }, { id: i, t: T(p[1]), ref: false }]));
  const grid = el('div', 'mem'); area.appendChild(grid);
  let open = [], lock = false, matched = 0, tries = 0, fin = false;
  deck.forEach((c, k) => {
    const d = el('div', 'mc', '<div class="in"><div class="f">💡</div><div class="b' + (c.ref ? ' ref' : '') + '">' + c.t + '</div></div>');
    d.dataset.id = c.id; d.dataset.k = k;
    d.onclick = () => {
      if (lock || fin || d.classList.contains('flip')) return;
      sfx.click(); d.classList.add('flip'); open.push(d);
      if (open.length === 2) {
        tries++; const [a, b] = open;
        if (a.dataset.id === b.dataset.id) {
          a.classList.add('done'); b.classList.add('done'); open = []; matched++; sfx.ok();
          if (matched === pairs.length) { fin = true; sfx.win(); setTimeout(() => done(100 + Math.max(0, 60 - Math.max(0, tries - 8) * 5)), 900); }
        } else {
          lock = true; setTimeout(() => { a.classList.remove('flip'); b.classList.remove('flip'); open = []; lock = false; }, 950);
        }
      }
    };
    grid.appendChild(d);
  });
}
