<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking en Vivo · Seminario</title>
<style>
:root{--bg:#0A0E1A;--card:#141B2E;--gold:#E8B24D;--cyan:#2DD4E8;--rose:#fb7185;--text:#fff;--muted:#B8C2D9;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#24163f 0%,var(--bg) 60%) fixed;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,5vw,44px);background:linear-gradient(90deg,var(--gold),#ffd98a,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:6px 0 0;font-size:clamp(14px,2.4vw,18px)}
.live{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}
.live.off{color:#f87171}.live.off .dot{background:#f87171;box-shadow:0 0 10px #f87171}
@keyframes pulse{50%{opacity:.3}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{background:var(--card);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:clamp(26px,5vw,40px);color:var(--gold)}
.stat span{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px 18px;margin:10px 0;font-size:clamp(17px,3vw,24px);transition:transform .3s}
.row.top{border:1px solid rgba(232,178,77,.5);box-shadow:0 0 22px rgba(232,178,77,.15)}
.pos{width:46px;text-align:center;font-weight:800;color:var(--muted)}
.name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:.8em;color:var(--muted);white-space:nowrap}
.state.done{color:var(--ok)}
.pts{font-weight:800;color:var(--rose);min-width:90px;text-align:right}
.bar{height:8px;border-radius:4px;background:#1a2340;overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:20px}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
#games{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
#games a{color:var(--muted);text-decoration:none;font-size:13px;border:1px solid #2c3656;border-radius:999px;padding:6px 12px}
#games a.on{color:#0A0E1A;background:var(--gold);border-color:var(--gold)}
@media (max-width:600px){
  .row{gap:10px;padding:12px 14px}
  .pos{width:34px}
  .name{white-space:normal;word-break:break-word}
  .state.done{display:none}
  .state{font-size:.72em}
  .pts{min-width:auto}
  .bar{width:70px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">🏆 Ranking en vivo</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="live-txt">En vivo</span></div>
  </header>
  <div class="stats">
    <div class="stat"><b id="st-total">0</b><span>Jugadores</span></div>
    <div class="stat"><b id="st-play">0</b><span>Jugando</span></div>
    <div class="stat"><b id="st-done">0</b><span>Terminaron</span></div>
  </div>
  <div id="list"><div class="empty">Esperando jugadores… 🎮</div></div>
  <footer id="foot"></footer>
  <nav id="games"></nav>
</div>
<script>
'use strict';
const RANKING_URL = 'https://script.google.com/macros/s/AKfycbwTCdA6fbDs97164sMVTaIkBkyGA8gv94w-vY2nYSFgcfo9pbblG2UWhlgh7Cuiotgx9g/exec';
const GAMES = {
  'tablas-de-carne': { name: 'Tablas en el Corazón', ref: 'Jeremías 31', levels: 4 },
  'la-palabra': { name: 'La Palabra que Nadie Pudo Quemar', ref: 'Jeremías 36', levels: 5 }
};
const LATEST = 'la-palabra';
const qs = new URLSearchParams(location.search);
const JUEGO = qs.get('juego') || LATEST;
const today = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
const FECHA = qs.get('fecha') || today();
const G = GAMES[JUEGO] || { name: JUEGO, ref: '', levels: 4 };
document.getElementById('title').textContent = '🏆 ' + G.name;
document.getElementById('sub').textContent = (G.ref ? G.ref + ' · ' : '') + 'Ranking en vivo · ' + FECHA.split('-').reverse().join('/');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function render(lista) {
  const done = lista.filter(r => r.estado === 'terminado').sort((a, b) => b.puntaje - a.puntaje);
  const play = lista.filter(r => r.estado !== 'terminado').sort((a, b) => b.nivel - a.nivel);
  document.getElementById('st-total').textContent = lista.length;
  document.getElementById('st-play').textContent = play.length;
  document.getElementById('st-done').textContent = done.length;
  const box = document.getElementById('list');
  if (!lista.length) { box.innerHTML = '<div class="empty">Esperando jugadores… 🎮</div>'; return; }
  const medal = ['🥇', '🥈', '🥉'];
  let html = '';
  done.forEach((r, i) => {
    html += '<div class="row' + (i < 3 ? ' top' : '') + '"><div class="pos">' + (medal[i] || (i + 1)) + '</div><div class="name">' + esc(r.nombre) + '</div><div class="state done">✔ Terminó</div><div class="pts">' + Number(r.puntaje).toLocaleString('es-AR') + '</div></div>';
  });
  play.forEach(r => {
    const n = Number(r.nivel) || 0, lv = G.levels;
    const txt = n > lv ? 'Reflexión final' : 'Nivel ' + Math.max(1, n) + '/' + lv;
    const pct = Math.min(100, Math.round((Math.min(n, lv + 1) - 1) / lv * 100));
    html += '<div class="row"><div class="pos">⏳</div><div class="name">' + esc(r.nombre) + '</div><div class="state">' + txt + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  });
  box.innerHTML = html;
}
async function refresh() {
  const live = document.getElementById('live');
  try {
    const r = await fetch(RANKING_URL + '?juego=' + encodeURIComponent(JUEGO) + '&fecha=' + FECHA + '&t=' + Date.now());
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'error');
    render(d.lista || []);
    live.classList.remove('off'); document.getElementById('live-txt').textContent = 'En vivo';
    document.getElementById('foot').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-AR') + ' · se actualiza cada 5 segundos';
  } catch (e) {
    live.classList.add('off'); document.getElementById('live-txt').textContent = 'Sin conexión, reintentando…';
  }
}
// selector de juego
const sel = document.getElementById('games');
Object.entries(GAMES).forEach(([id, g]) => {
  const a = document.createElement('a'); a.href = '?juego=' + id; a.textContent = g.ref + ' · ' + g.name;
  if (id === JUEGO) a.className = 'on'; sel.appendChild(a);
});
window.__render = render; // para pruebas
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
